name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      should-publish: ${{ steps.tag.outputs.published }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Create version PR or tag release
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm run version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag release when version PR merges
        id: tag
        if: steps.changesets.outputs.has-changesets == 'false'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # Pushes without changesets (docs, tooling) leave the version unchanged
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null; then
            echo "v${VERSION} is already released"
            exit 0
          fi
          git tag "v${VERSION}"
          git push origin "v${VERSION}"
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  publish:
    needs: version
    if: needs.version.outputs.should-publish == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.version.outputs.version }}

      - name: Build Release
        run: |
          xcodebuild -scheme StatusBar -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            build

      - name: Zip app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/Build/Products/Release/StatusBar.app \
            "StatusBar-${{ needs.version.outputs.version }}.zip"

      - name: Create GitHub Release
        run: |
          gh release create "v${{ needs.version.outputs.version }}" \
            "StatusBar-${{ needs.version.outputs.version }}.zip" \
            --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
