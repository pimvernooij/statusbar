name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build
        run: |
          xcodebuild -scheme StatusBar -destination 'platform=macOS' \
            -derivedDataPath build \
            build

      - name: Package app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/Build/Products/Debug/StatusBar.app \
            StatusBar.zip

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: StatusBar
          path: StatusBar.zip
